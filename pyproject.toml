[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gi-coder"
version = "1.0.0"
description = "Local Qwen coding CLI powered by llama.cpp"
requires-python = ">=3.10"
dependencies = ["huggingface-hub==0.30.2"]

[project.scripts]
gi-coder = "gi_coder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
